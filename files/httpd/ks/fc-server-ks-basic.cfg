# Generated by Anaconda 45.30
# Keyboard layouts
keyboard --vckeymap=us --xlayouts='us'
# System language
lang en_US.UTF-8

# Reboot after installation is complete
reboot

%packages
@^server-product-environment
@guest-agents
@server-hardware-support

%end

# System authorization information
authselect enable-feature with-fingerprint

# Run the Setup Agent on first boot
firstboot --disable

# Generated using Blivet version 3.14.2
ignoredisk --only-use=sda
# Partition clearing information
clearpart --drives=sda --initlabel
part /boot --fstype="xfs" --ondisk=sda --size=1024 --label="boot"
part /boot/efi --fstype="vfat" --ondisk=sda --size=512 --fsoptions="umask=0077,shortname=winnt" --label="efi"
part pv.126 --fstype="lvmpv" --ondisk=sda --grow
part biosboot --fstype="biosboot" --ondisk=sda --size=2
volgroup fc --pesize=4096 pv.126
logvol / --fstype="xfs" --size=20480 --label="root" --name=root --vgname=fc

# System timezone
timezone America/New_York --utc

# Root password
rootpw --iscrypted --allow-ssh $y$j9T$rg/twB/h9O4MmS1eiqqScNxh$Kltr4N1xXyMzs.fsI9y5ih4Um7iv6q0UJ4dS08J4U8/
group --name=ansible --gid=2015
user --groups=wheel --name=ansible --uid=2015 --gid=2015

#################################################
#################################################
# Post Install Script - Configures Network      #
#                     - Hands-off to Ansible    #
#################################################
#################################################
%post --interpreter /bin/bash --log=/root/kickstart-post.log
# Add Ansible shared key
mkdir -p /home/ansible/.ssh
chmod go-rwx /home/ansible/.ssh
cat > /home/ansible/.ssh/authorized_keys <<EOF
ssh-rsa . . . YOUR_KEY . . . ansible@cicd
EOF
chown -R ansible:ansible /home/ansible

# Enable Sudoers
echo "ansible   ALL=(ALL)       NOPASSWD: ALL" >> /etc/sudoers
%end
